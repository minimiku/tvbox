name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties
      run: touch local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build ARM64 (64-bit)
      run: ./gradlew assembleArm64GenericNormalDebug --stacktrace

    - name: Build ARM (32-bit)
      run: ./gradlew assembleArmGenericNormalDebug --stacktrace

    - name: Upload ARM64 APK (for phones)
      uses: actions/upload-artifact@v4
      with:
        name: tvbox-arm64-debug
        path: app/build/outputs/apk/arm64GenericNormal/debug/*.apk

    - name: Upload ARM APK (for TV boxes)
      uses: actions/upload-artifact@v4
      with:
        name: tvbox-arm-debug
        path: app/build/outputs/apk/armGenericNormal/debug/*.apk

